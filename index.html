<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 מטלות בית</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e42;
    --accent: #7c6af7;
    --accent2: #f7a26a;
    --text: #e8e8f0;
    --text-muted: #7a7a9a;
    --danger: #f76a6a;
    --success: #6af7a2;
    --warning: #f7d46a;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, #1a1a24 0%, #16162a 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .app-title {
    font-size: 24px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .app-icon { font-size: 26px; }

  .header-stats {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .stat-pill.done   { border-color: var(--success); color: var(--success); }
  .stat-pill.pending{ border-color: var(--warning); color: var(--warning); }
  .stat-pill.na     { border-color: var(--text-muted); color: var(--text-muted); }

  /* ===== PAGE ===== */
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 16px 80px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ===== ROOM CARD ===== */
  .room-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .room-card:hover { border-color: rgba(124,106,247,0.35); }

  .room-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .room-card-left { display: flex; align-items: center; gap: 13px; }

  .room-emoji-btn {
    font-size: 34px;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 3px;
    border-radius: 10px;
    transition: transform 0.2s;
    line-height: 1;
  }
  .room-emoji-btn:hover { transform: scale(1.15); }

  .room-title {
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    border-radius: 6px;
    padding: 2px 5px;
    transition: background 0.15s, color 0.15s;
    display: inline-block;
  }
  .room-title:hover { background: rgba(124,106,247,0.1); color: var(--accent); }

  .room-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .mini-bar {
    width: 55px; height: 4px;
    background: var(--border);
    border-radius: 99px; overflow: hidden;
    display: inline-block;
  }
  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .room-card-right { display: flex; align-items: center; gap: 8px; }

  .add-task-btn {
    background: linear-gradient(135deg, var(--accent), #9b8bf8);
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 10px;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
    box-shadow: 0 3px 10px rgba(124,106,247,0.3);
    white-space: nowrap;
  }
  .add-task-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(124,106,247,0.4); }
  .add-task-btn:active { transform: translateY(0); }

  .collapse-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .collapse-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Tasks body */
  .room-body {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .room-body.collapsed { display: none; }

  /* ===== TASK ITEM ===== */
  .task-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
    animation: slideIn 0.22s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-item:hover { border-color: rgba(124,106,247,0.4); background: var(--surface2); }

  /* status styles */
  .task-item[data-status="done"] { border-color: rgba(106,247,162,0.2); }
  .task-item[data-status="done"] .task-text { text-decoration: line-through; color: var(--text-muted); opacity: 0.7; }
  .task-item[data-status="na"] { opacity: 0.4; }
  .task-item[data-status="na"] .task-text { text-decoration: line-through; }

  /* ===== STATUS SELECTOR ===== */
  .status-selector {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .status-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 5px 8px;
    font-size: 11px;
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    color: var(--text-muted);
    transition: all 0.18s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 3px;
    border-left: 1px solid var(--border);
    line-height: 1;
  }
  .status-btn:first-child { border-left: none; }
  .status-btn:hover { background: var(--surface2); color: var(--text); }

  .status-btn.active-pending {
    background: rgba(247,212,106,0.15);
    color: var(--warning);
  }
  .status-btn.active-done {
    background: rgba(106,247,162,0.15);
    color: var(--success);
  }
  .status-btn.active-na {
    background: rgba(122,122,154,0.15);
    color: var(--text-muted);
  }

  .task-emoji-btn {
    font-size: 20px;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 2px;
    border-radius: 6px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .task-emoji-btn:hover { transform: scale(1.2); }

  .task-text {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background 0.15s, opacity 0.2s;
    min-width: 0;
  }
  .task-text:hover { background: rgba(124,106,247,0.08); }

  .task-actions {
    display: flex;
    gap: 5px;
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .task-item:hover .task-actions { opacity: 1; }

  .task-action-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 28px; height: 28px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.2s;
  }
  .task-action-btn:hover { background: var(--surface2); color: var(--text); }
  .task-action-btn.delete:hover { border-color: var(--danger); color: var(--danger); }

  .room-empty {
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .inline-edit-input {
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--accent);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 500;
    width: 100%;
    outline: none;
    padding: 2px 4px;
    direction: rtl;
  }

  /* ===== MODALS ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.15s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px;
    width: 90%;
    max-width: 420px;
    animation: popIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal h3 {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .modal-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 5px;
    display: block;
    font-weight: 600;
  }

  .modal-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 15px;
    direction: rtl;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 14px;
  }
  .modal-input:focus { border-color: var(--accent); }

  .emoji-categories {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .emoji-cat-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
    transition: all 0.15s;
  }
  .emoji-cat-btn.active { background: rgba(124,106,247,0.2); border-color: var(--accent); color: var(--accent); }
  .emoji-cat-btn:hover { color: var(--text); }

  .emoji-search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 11px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    direction: rtl;
    outline: none;
    margin-bottom: 7px;
  }
  .emoji-search:focus { border-color: var(--accent); }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
    margin-bottom: 16px;
    max-height: 190px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .emoji-opt {
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
    border-radius: 7px;
    text-align: center;
    border: 2px solid transparent;
    transition: all 0.12s;
    background: transparent;
  }
  .emoji-opt:hover { background: var(--surface2); transform: scale(1.15); }
  .emoji-opt.selected { border-color: var(--accent); background: rgba(124,106,247,0.15); }

  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }

  .btn-cancel {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 9px 17px;
    border-radius: 10px;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel:hover { color: var(--text); }

  .btn-save {
    background: linear-gradient(135deg, var(--accent), #9b8bf8);
    border: none;
    color: white;
    padding: 9px 20px;
    border-radius: 10px;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(124,106,247,0.3);
  }
  .btn-save:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124,106,247,0.4); }

  @media (max-width: 560px) {
    .header { padding: 14px; }
    .header-stats { gap: 6px; }
    .stat-pill { padding: 3px 7px; font-size: 11px; }
    .page { padding: 14px 10px 80px; gap: 12px; }
    .task-actions { opacity: 1; }
    .status-btn { padding: 4px 5px; font-size: 10px; }
    .room-card-header { flex-wrap: wrap; gap: 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="app-icon">🏠</span>
    <span class="app-title">מטלות הבית</span>
  </div>
  <div class="header-stats" id="headerStats"></div>
</div>

<div class="page" id="pageContent"></div>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal" style="display:none" onclick="handleTaskOverlay(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">➕ מטלה חדשה</h3>
    <label class="modal-label">שם המטלה</label>
    <input class="modal-input" id="taskNameInput" placeholder="לדוגמה: לשטוף כלים..." />
    <label class="modal-label">אימוג'י</label>
    <div class="emoji-categories" id="emojiCategories"></div>
    <input class="emoji-search" id="emojiSearch" placeholder="חפש אימוג'י..." oninput="filterEmojis()" />
    <div class="emoji-grid" id="emojiGrid"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeTaskModal()">ביטול</button>
      <button class="btn-save" onclick="saveTask()">שמור</button>
    </div>
  </div>
</div>

<!-- Room Modal -->
<div class="modal-overlay" id="roomModal" style="display:none" onclick="handleRoomOverlay(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>✏️ עריכת חדר</h3>
    <label class="modal-label">שם החדר</label>
    <input class="modal-input" id="roomNameInput" placeholder="שם החדר..." />
    <label class="modal-label">אימוג'י לחדר</label>
    <div class="emoji-categories" id="roomEmojiCategories"></div>
    <input class="emoji-search" id="roomEmojiSearch" placeholder="חפש אימוג'י..." oninput="buildRoomEmojiGrid()" />
    <div class="emoji-grid" id="roomEmojiGrid"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRoomModal()">ביטול</button>
      <button class="btn-save" onclick="saveRoom()">שמור</button>
    </div>
  </div>
</div>

<script>
// ===== EMOJI DATA =====
const EMOJI_CATEGORIES = {
  'ניקיון 🧹': ['🧹','🧺','🧻','🧽','🪣','💧','🫧','🧴','🧼','🪥','🪠','♻️','🗑️'],
  'מטבח 🍳': ['🍳','🥗','🍽️','🥄','🍴','☕','🧃','🫙','🥡','🍜','🥘','🫕','🧆'],
  'כלים 🔧': ['🔧','🔨','🪛','🔩','⚙️','🧲','💡','🔌','🪜','🗝️','🔑','📦','🧰'],
  'טבע 🌿': ['🌿','🌸','🌺','🌻','🍀','🌴','🌵','💐','🪴','☀️','🌙','🌈','🌊'],
  'כללי ⭐': ['✅','❌','⚠️','🔥','⭐','🌟','💪','👍','❤️','🎯','🏆','✨','💎','🎁'],
};
const ALL_EMOJIS = [...new Set(Object.values(EMOJI_CATEGORIES).flat())];
const ROOM_EMOJIS_EXTRA = ['🏠','🛁','🚽','🛏️','💻','🛋️','🌿','🍳','🚿','🪑','🚪','💡','🧹','🏡','🎨','📚','🎵','🏋️','🎮','🛒'];

// ===== STATUS CONFIG =====
// status: 'pending' | 'done' | 'na'
const STATUS = {
  pending: { label: 'ממתין',      icon: '⏳', cls: 'active-pending' },
  done:    { label: 'בוצע',       icon: '✅', cls: 'active-done'    },
  na:      { label: 'לא רלוונטי', icon: '➖', cls: 'active-na'      },
};

// ===== STATE =====
const defaultRooms = [
  { id: 'kitchen',  name: 'מטבח',       emoji: '🍳', tasks: [], collapsed: false },
  { id: 'bathroom', name: 'חדר אמבטיה', emoji: '🛁', tasks: [], collapsed: false },
  { id: 'toilet',   name: 'שירותים',    emoji: '🚽', tasks: [], collapsed: false },
  { id: 'bedroom',  name: 'חדר שינה',   emoji: '🛏️', tasks: [], collapsed: false },
  { id: 'office',   name: 'חדר עבודה',  emoji: '💻', tasks: [], collapsed: false },
  { id: 'living',   name: 'סלון',       emoji: '🛋️', tasks: [], collapsed: false },
  { id: 'balcony',  name: 'מרפסת',      emoji: '🌿', tasks: [], collapsed: false },
];

function loadData() {
  try { const s = localStorage.getItem('homeTasks_v4'); if (s) return JSON.parse(s); } catch(e) {}
  return { rooms: defaultRooms };
}
function saveData() { localStorage.setItem('homeTasks_v4', JSON.stringify(appState)); }

let appState = loadData();

// modal state
let mTaskRoomId = null, mTaskId = null, mEmojiCat = null, mEmoji = '✅';
let mRoomId = null, mRoomEmojiCat = null, mRoomEmoji = '';

// ===== RENDER =====
function render() {
  // header stats
  let totalPending=0, totalDone=0, totalNa=0;
  appState.rooms.forEach(r => r.tasks.forEach(t => {
    if(t.status==='done') totalDone++;
    else if(t.status==='na') totalNa++;
    else totalPending++;
  }));

  const statsEl = document.getElementById('headerStats');
  statsEl.innerHTML = (totalPending+totalDone+totalNa) > 0 ? `
    <span class="stat-pill pending">⏳ ${totalPending}</span>
    <span class="stat-pill done">✅ ${totalDone}</span>
    <span class="stat-pill na">➖ ${totalNa}</span>
  ` : '';

  // rooms
  document.getElementById('pageContent').innerHTML = appState.rooms.map(room => {
    const total   = room.tasks.length;
    const done    = room.tasks.filter(t=>t.status==='done').length;
    const pending = room.tasks.filter(t=>t.status==='pending'||!t.status).length;
    const pct     = total ? Math.round((done/total)*100) : 0;

    const tasksHTML = room.tasks.length === 0
      ? `<div class="room-empty">אין מטלות — לחץ "+ הוסף" להתחלה 👆</div>`
      : room.tasks.map(t => {
          const status = t.status || 'pending';
          return `
            <div class="task-item" data-status="${status}" id="task-${t.id}">
              <button class="task-emoji-btn" onclick="openEditTaskModal('${room.id}','${t.id}',true)">${t.emoji}</button>
              <span class="task-text" onclick="startInlineEdit('${room.id}','${t.id}')">${t.text}</span>
              <div class="status-selector">
                <button class="status-btn ${status==='pending'?'active-pending':''}" onclick="setStatus('${room.id}','${t.id}','pending')" title="ממתין לביצוע">⏳ ממתין</button>
                <button class="status-btn ${status==='done'?'active-done':''}"    onclick="setStatus('${room.id}','${t.id}','done')"    title="בוצע">✅ בוצע</button>
                <button class="status-btn ${status==='na'?'active-na':''}"        onclick="setStatus('${room.id}','${t.id}','na')"      title="לא רלוונטי">➖ לא רלוונטי</button>
              </div>
              <div class="task-actions">
                <button class="task-action-btn" onclick="openEditTaskModal('${room.id}','${t.id}',false)" title="ערוך">✏️</button>
                <button class="task-action-btn delete" onclick="deleteTask('${room.id}','${t.id}')" title="מחק">🗑️</button>
              </div>
            </div>
          `;
        }).join('');

    return `
      <div class="room-card" id="room-${room.id}">
        <div class="room-card-header">
          <div class="room-card-left">
            <button class="room-emoji-btn" onclick="openRoomModal('${room.id}')">${room.emoji}</button>
            <div>
              <span class="room-title" onclick="openRoomModal('${room.id}')">${room.name}</span>
              <div class="room-meta">
                ${total > 0
                  ? `<div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
                     <span>${done}/${total} בוצעו · ${pending} ממתינות</span>`
                  : `<span>אין מטלות</span>`}
              </div>
            </div>
          </div>
          <div class="room-card-right">
            <button class="add-task-btn" onclick="openAddTaskModal('${room.id}')">+ הוסף</button>
            <button class="collapse-btn" onclick="toggleCollapse('${room.id}')">${room.collapsed?'▼':'▲'}</button>
          </div>
        </div>
        <div class="room-body${room.collapsed?' collapsed':''}">${tasksHTML}</div>
      </div>
    `;
  }).join('');
}

// ===== ACTIONS =====
function toggleCollapse(id) {
  const r = appState.rooms.find(r=>r.id===id);
  if (r) { r.collapsed = !r.collapsed; saveData(); render(); }
}

function setStatus(roomId, taskId, status) {
  const r = appState.rooms.find(r=>r.id===roomId);
  const t = r?.tasks.find(t=>t.id===taskId);
  if (t) { t.status = status; saveData(); render(); }
}

function deleteTask(roomId, taskId) {
  const r = appState.rooms.find(r=>r.id===roomId);
  if (r) { r.tasks = r.tasks.filter(t=>t.id!==taskId); saveData(); render(); }
}

function startInlineEdit(roomId, taskId) {
  const r = appState.rooms.find(r=>r.id===roomId);
  const t = r?.tasks.find(t=>t.id===taskId);
  if (!t) return;
  const el = document.querySelector(`#task-${taskId} .task-text`);
  if (!el) return;
  const input = document.createElement('input');
  input.className = 'inline-edit-input';
  input.value = t.text; input.dir = 'rtl';
  el.replaceWith(input); input.focus(); input.select();
  const commit = () => { const v=input.value.trim(); if(v){t.text=v;saveData();} render(); };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();commit();} if(e.key==='Escape')render(); });
}

// ===== EMOJI HELPERS =====
function buildCatBtns(containerId, activeCat, clickFn) {
  document.getElementById(containerId).innerHTML = Object.keys(EMOJI_CATEGORIES).map(cat =>
    `<button class="emoji-cat-btn${cat===activeCat?' active':''}" onclick="${clickFn}('${encodeURIComponent(cat)}')">${cat}</button>`
  ).join('');
}
function buildGrid(gridId, searchId, activeCat, selected, clickFn) {
  const search = (document.getElementById(searchId)?.value||'').toLowerCase();
  let pool = (activeCat && EMOJI_CATEGORIES[activeCat]) ? EMOJI_CATEGORIES[activeCat] : ALL_EMOJIS;
  if (search) pool = ALL_EMOJIS;
  document.getElementById(gridId).innerHTML = pool.map(e =>
    `<button class="emoji-opt${e===selected?' selected':''}" onclick="${clickFn}('${e}')">${e}</button>`
  ).join('');
}

// ===== TASK MODAL =====
function openAddTaskModal(roomId) {
  mTaskRoomId=roomId; mTaskId=null; mEmoji='✅'; mEmojiCat=null;
  document.getElementById('modalTitle').textContent='➕ מטלה חדשה';
  document.getElementById('taskNameInput').value='';
  document.getElementById('emojiSearch').value='';
  buildCatBtns('emojiCategories',null,'setTaskCat');
  buildGrid('emojiGrid','emojiSearch',null,mEmoji,'pickEmoji');
  document.getElementById('taskModal').style.display='flex';
  setTimeout(()=>document.getElementById('taskNameInput').focus(),80);
}
function openEditTaskModal(roomId, taskId, emojiOnly=false) {
  const r=appState.rooms.find(r=>r.id===roomId);
  const t=r?.tasks.find(t=>t.id===taskId); if(!t) return;
  mTaskRoomId=roomId; mTaskId=taskId; mEmoji=t.emoji; mEmojiCat=null;
  document.getElementById('modalTitle').textContent=emojiOnly?"😊 שנה אימוג'י":'✏️ עריכת מטלה';
  document.getElementById('taskNameInput').value=t.text;
  document.getElementById('emojiSearch').value='';
  buildCatBtns('emojiCategories',null,'setTaskCat');
  buildGrid('emojiGrid','emojiSearch',null,mEmoji,'pickEmoji');
  document.getElementById('taskModal').style.display='flex';
  if(!emojiOnly) setTimeout(()=>document.getElementById('taskNameInput').focus(),80);
}
function setTaskCat(cat) {
  const d=decodeURIComponent(cat); mEmojiCat=(mEmojiCat===d)?null:d;
  buildCatBtns('emojiCategories',mEmojiCat,'setTaskCat');
  buildGrid('emojiGrid','emojiSearch',mEmojiCat,mEmoji,'pickEmoji');
}
function pickEmoji(e) { mEmoji=e; buildGrid('emojiGrid','emojiSearch',mEmojiCat,mEmoji,'pickEmoji'); }
function filterEmojis() { buildGrid('emojiGrid','emojiSearch',mEmojiCat,mEmoji,'pickEmoji'); }
function closeTaskModal() { document.getElementById('taskModal').style.display='none'; }
function handleTaskOverlay(e) { if(e.target===document.getElementById('taskModal'))closeTaskModal(); }
function saveTask() {
  const text=document.getElementById('taskNameInput').value.trim();
  if(!text){document.getElementById('taskNameInput').focus();return;}
  const r=appState.rooms.find(r=>r.id===mTaskRoomId); if(!r) return;
  if(!mTaskId) {
    r.tasks.push({id:Date.now().toString(), text, emoji:mEmoji, status:'pending'});
  } else {
    const t=r.tasks.find(t=>t.id===mTaskId);
    if(t){t.text=text; t.emoji=mEmoji;}
  }
  saveData(); closeTaskModal(); render();
}

// ===== ROOM MODAL =====
function openRoomModal(roomId) {
  const r=appState.rooms.find(r=>r.id===roomId); if(!r) return;
  mRoomId=roomId; mRoomEmoji=r.emoji; mRoomEmojiCat=null;
  document.getElementById('roomNameInput').value=r.name;
  document.getElementById('roomEmojiSearch').value='';
  buildRoomCatBtns(); buildRoomEmojiGrid();
  document.getElementById('roomModal').style.display='flex';
  setTimeout(()=>document.getElementById('roomNameInput').focus(),80);
}
function buildRoomCatBtns() { buildCatBtns('roomEmojiCategories',mRoomEmojiCat,'setRoomCat'); }
function buildRoomEmojiGrid() {
  let pool=(mRoomEmojiCat && EMOJI_CATEGORIES[mRoomEmojiCat])
    ? EMOJI_CATEGORIES[mRoomEmojiCat]
    : [...new Set([...ROOM_EMOJIS_EXTRA,...ALL_EMOJIS])];
  document.getElementById('roomEmojiGrid').innerHTML=pool.map(e=>
    `<button class="emoji-opt${e===mRoomEmoji?' selected':''}" onclick="pickRoomEmoji('${e}')">${e}</button>`
  ).join('');
}
function setRoomCat(cat) {
  const d=decodeURIComponent(cat); mRoomEmojiCat=(mRoomEmojiCat===d)?null:d;
  buildRoomCatBtns(); buildRoomEmojiGrid();
}
function pickRoomEmoji(e) { mRoomEmoji=e; buildRoomEmojiGrid(); }
function closeRoomModal() { document.getElementById('roomModal').style.display='none'; }
function handleRoomOverlay(e) { if(e.target===document.getElementById('roomModal'))closeRoomModal(); }
function saveRoom() {
  const name=document.getElementById('roomNameInput').value.trim();
  if(!name){document.getElementById('roomNameInput').focus();return;}
  const r=appState.rooms.find(r=>r.id===mRoomId);
  if(r){r.name=name; r.emoji=mRoomEmoji;}
  saveData(); closeRoomModal(); render();
}

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){closeTaskModal();closeRoomModal();}
  if(e.key==='Enter'){
    if(document.getElementById('taskModal').style.display!=='none'&&document.activeElement===document.getElementById('taskNameInput'))saveTask();
    if(document.getElementById('roomModal').style.display!=='none'&&document.activeElement===document.getElementById('roomNameInput'))saveRoom();
  }
});

render();
</script>
</body>
</html>
