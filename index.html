<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 מטלות בית</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== THEMES ===== */
  body[data-theme="dark"] {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e42;
    --accent: #7c6af7;
    --accent2: #f7a26a;
    --text: #e8e8f0;
    --text-muted: #7a7a9a;
    --danger: #f76a6a;
    --success: #6af7a2;
    --warning: #f7d46a;
    --header-bg: linear-gradient(135deg,#1a1a24,#16162a);
    --room-header-bg: #22222f;
    --task-bg: #0f0f13;
    --shadow: rgba(0,0,0,0.4);
  }
  body[data-theme="light"] {
    --bg: #f4f5fa;
    --surface: #ffffff;
    --surface2: #f0f1f8;
    --border: #dde0f0;
    --accent: #6355e8;
    --accent2: #f0812a;
    --text: #1a1a2e;
    --text-muted: #8890b0;
    --danger: #e03c3c;
    --success: #21a660;
    --warning: #c99000;
    --header-bg: linear-gradient(135deg,#ffffff,#f4f5fa);
    --room-header-bg: #f0f1f8;
    --task-bg: #f8f9fd;
    --shadow: rgba(100,100,150,0.08);
  }
  body[data-theme="pastel"] {
    --bg: #fdf0f8;
    --surface: #ffffff;
    --surface2: #fce8f5;
    --border: #f0c8e8;
    --accent: #d45faa;
    --accent2: #f0a040;
    --text: #3a1a30;
    --text-muted: #b080a0;
    --danger: #e05050;
    --success: #40b860;
    --warning: #c09000;
    --header-bg: linear-gradient(135deg,#fff0fb,#fce8f5);
    --room-header-bg: #fce8f5;
    --task-bg: #fff8fd;
    --shadow: rgba(200,100,180,0.08);
  }
  body[data-theme="mint"] {
    --bg: #edfaf6;
    --surface: #ffffff;
    --surface2: #ddf5ee;
    --border: #b8e8d8;
    --accent: #1a9e72;
    --accent2: #f07040;
    --text: #0a2e22;
    --text-muted: #6aaa90;
    --danger: #e04040;
    --success: #1a9e72;
    --warning: #b08000;
    --header-bg: linear-gradient(135deg,#edfaf6,#d8f5ed);
    --room-header-bg: #ddf5ee;
    --task-bg: #f4fdf9;
    --shadow: rgba(26,158,114,0.08);
  }
  body[data-theme="ocean"] {
    --bg: #0d1f35;
    --surface: #132840;
    --surface2: #1a3350;
    --border: #1e4060;
    --accent: #38bdf8;
    --accent2: #fb923c;
    --text: #e0f0ff;
    --text-muted: #5a90b8;
    --danger: #f87171;
    --success: #4ade80;
    --warning: #fbbf24;
    --header-bg: linear-gradient(135deg,#132840,#0d1f35);
    --room-header-bg: #1a3350;
    --task-bg: #0d1f35;
    --shadow: rgba(0,20,60,0.4);
  }
  body[data-theme="sunset"] {
    --bg: #1a0f1e;
    --surface: #2a1530;
    --surface2: #351840;
    --border: #502060;
    --accent: #f97316;
    --accent2: #ec4899;
    --text: #fde8ff;
    --text-muted: #a060c0;
    --danger: #f87171;
    --success: #4ade80;
    --warning: #fbbf24;
    --header-bg: linear-gradient(135deg,#2a1530,#1a0f1e);
    --room-header-bg: #351840;
    --task-bg: #1a0f1e;
    --shadow: rgba(0,0,0,0.5);
  }
  body[data-theme="sand"] {
    --bg: #faf6ee;
    --surface: #ffffff;
    --surface2: #f5efe0;
    --border: #e8d8b8;
    --accent: #b07030;
    --accent2: #508060;
    --text: #2a1a08;
    --text-muted: #a08060;
    --danger: #c04030;
    --success: #407040;
    --warning: #907020;
    --header-bg: linear-gradient(135deg,#fff8ee,#f5efe0);
    --room-header-bg: #f5efe0;
    --task-bg: #fdf9f2;
    --shadow: rgba(100,60,20,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
    transition: background 0.35s, color 0.35s;
  }

  /* ===== HEADER ===== */
  .header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 2px 12px var(--shadow);
    transition: background 0.35s, border-color 0.35s;
  }

  .header-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .app-title {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .app-icon { font-size: 24px; }

  .header-center {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.3s;
  }
  .stat-pill.done    { border-color: var(--success); color: var(--success); }
  .stat-pill.pending { border-color: var(--warning); color: var(--warning); }
  .stat-pill.na      { border-color: var(--text-muted); color: var(--text-muted); }

  /* Theme button */
  .theme-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 34px; height: 34px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); transform: rotate(20deg); }

  /* Theme panel */
  .theme-panel {
    position: fixed;
    top: 70px;
    left: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    z-index: 200;
    box-shadow: 0 8px 32px var(--shadow);
    min-width: 240px;
    animation: popIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
    transition: background 0.35s, border-color 0.35s;
  }
  .theme-panel.hidden { display: none; }

  @keyframes popIn {
    from { opacity:0; transform:scale(0.85) translateY(-10px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }

  .theme-panel h4 {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .theme-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .theme-option {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface2);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .theme-option:hover { border-color: var(--accent); background: var(--surface); }
  .theme-option.active { border-color: var(--accent); background: var(--surface); }

  .theme-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.3);
  }

  /* ===== PAGE ===== */
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 80px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ===== ROOM CARD ===== */
  .room-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    transition: border-color 0.2s, background 0.35s;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .room-card:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

  .room-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--room-header-bg);
    transition: background 0.35s, border-color 0.35s;
  }

  .room-card-left { display: flex; align-items: center; gap: 12px; }

  .room-emoji-btn {
    font-size: 32px;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 2px;
    border-radius: 8px;
    transition: transform 0.2s;
    line-height: 1;
  }
  .room-emoji-btn:hover { transform: scale(1.15); }

  .room-title {
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    border-radius: 6px;
    padding: 2px 5px;
    transition: background 0.15s, color 0.15s;
    display: inline-block;
    color: var(--text);
  }
  .room-title:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }

  .room-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mini-bar {
    width: 50px; height: 4px;
    background: var(--border);
    border-radius: 99px; overflow: hidden;
    display: inline-block;
  }
  .mini-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .room-card-right { display: flex; align-items: center; gap: 7px; }

  .add-task-btn {
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, white));
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 9px;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
    box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 35%, transparent);
    white-space: nowrap;
  }
  .add-task-btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .add-task-btn:active { transform: translateY(0); }

  .collapse-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .collapse-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Tasks body */
  .room-body {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    transition: background 0.35s;
  }
  .room-body.collapsed { display: none; }

  /* ===== TASK ITEM ===== */
  .task-item {
    background: var(--task-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    transition: all 0.2s;
    animation: slideIn 0.22s ease-out;
  }

  @keyframes slideIn {
    from { opacity:0; transform:translateY(-5px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .task-item:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: var(--surface2); }
  .task-item[data-status="done"] { border-color: color-mix(in srgb, var(--success) 25%, transparent); }
  .task-item[data-status="done"] .task-text { text-decoration: line-through; opacity: 0.5; }
  .task-item[data-status="na"]   { opacity: 0.38; }
  .task-item[data-status="na"]   .task-text { text-decoration: line-through; }

  /* ===== STATUS SELECTOR ===== */
  .status-selector {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .status-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 5px 8px;
    font-size: 11px;
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    color: var(--text-muted);
    transition: all 0.18s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 3px;
    border-right: 1px solid var(--border);
    line-height: 1;
  }
  .status-btn:last-child { border-right: none; }
  .status-btn:hover { background: var(--surface2); color: var(--text); }

  .status-btn.active-pending { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }
  .status-btn.active-done    { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
  .status-btn.active-na      { background: color-mix(in srgb, var(--text-muted) 15%, transparent); color: var(--text-muted); }

  .task-emoji-btn {
    font-size: 19px;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 2px;
    border-radius: 6px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .task-emoji-btn:hover { transform: scale(1.2); }

  .task-text {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background 0.15s;
    color: var(--text);
    min-width: 0;
  }
  .task-text:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }

  .task-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }
  .task-item:hover .task-actions { opacity: 1; }

  .task-action-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 27px; height: 27px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.2s;
  }
  .task-action-btn:hover { background: var(--surface2); color: var(--text); }
  .task-action-btn.delete:hover { border-color: var(--danger); color: var(--danger); }

  .room-empty {
    text-align: center;
    padding: 18px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .inline-edit-input {
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--accent);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 500;
    width: 100%;
    outline: none;
    padding: 2px 4px;
    direction: rtl;
  }

  /* ===== MODALS ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.15s;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    width: 90%;
    max-width: 420px;
    animation: popIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
    transition: background 0.35s, border-color 0.35s;
  }

  .modal h3 {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .modal-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 5px;
    display: block;
    font-weight: 600;
  }

  .modal-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 13px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 15px;
    direction: rtl;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 12px;
  }
  .modal-input:focus { border-color: var(--accent); }

  .emoji-categories {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 7px;
  }

  .emoji-cat-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
    transition: all 0.15s;
  }
  .emoji-cat-btn.active { background: color-mix(in srgb,var(--accent) 20%,transparent); border-color: var(--accent); color: var(--accent); }
  .emoji-cat-btn:hover { color: var(--text); }

  .emoji-search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 11px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    direction: rtl;
    outline: none;
    margin-bottom: 7px;
  }
  .emoji-search:focus { border-color: var(--accent); }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8,1fr);
    gap: 3px;
    margin-bottom: 14px;
    max-height: 180px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .emoji-opt {
    font-size: 19px;
    cursor: pointer;
    padding: 4px;
    border-radius: 7px;
    text-align: center;
    border: 2px solid transparent;
    transition: all 0.12s;
    background: transparent;
  }
  .emoji-opt:hover { background: var(--surface2); transform: scale(1.15); }
  .emoji-opt.selected { border-color: var(--accent); background: color-mix(in srgb,var(--accent) 15%,transparent); }

  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }

  .btn-cancel {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 9px 16px;
    border-radius: 10px;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel:hover { color: var(--text); }

  .btn-save {
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb,var(--accent) 70%,white));
    border: none;
    color: white;
    padding: 9px 20px;
    border-radius: 10px;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent);
  }
  .btn-save:hover { filter: brightness(1.1); transform: translateY(-1px); }

  @media (max-width: 580px) {
    .header { padding: 12px 14px; flex-wrap: wrap; gap: 8px; }
    .header-center { order: 3; width: 100%; justify-content: flex-start; }
    .page { padding: 12px 10px 80px; gap: 12px; }
    .task-actions { opacity: 1; }
    .status-btn { padding: 4px 5px; font-size: 10px; }
    .theme-panel { left: 10px; right: 10px; min-width: unset; }
  }
</style>
</head>
<body data-theme="dark">

<!-- Theme panel -->
<div class="theme-panel hidden" id="themePanel">
  <h4>🎨 בחר ערכת צבעים</h4>
  <div class="theme-grid" id="themeGrid"></div>
</div>

<div class="header">
  <div class="header-left">
    <span class="app-icon">🏠</span>
    <span class="app-title">מטלות הבית</span>
  </div>
  <div class="header-center" id="headerStats"></div>
  <button class="theme-btn" onclick="toggleThemePanel()" title="שנה ערכת צבעים">🎨</button>
</div>

<div class="page" id="pageContent"></div>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal" style="display:none" onclick="handleTaskOverlay(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">➕ מטלה חדשה</h3>
    <label class="modal-label">שם המטלה</label>
    <input class="modal-input" id="taskNameInput" placeholder="לדוגמה: לשטוף כלים..." />
    <label class="modal-label">אימוג'י</label>
    <div class="emoji-categories" id="emojiCategories"></div>
    <input class="emoji-search" id="emojiSearch" placeholder="חפש אימוג'י..." oninput="filterEmojis()" />
    <div class="emoji-grid" id="emojiGrid"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeTaskModal()">ביטול</button>
      <button class="btn-save" onclick="saveTask()">שמור</button>
    </div>
  </div>
</div>

<!-- Room Modal -->
<div class="modal-overlay" id="roomModal" style="display:none" onclick="handleRoomOverlay(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>✏️ עריכת חדר</h3>
    <label class="modal-label">שם החדר</label>
    <input class="modal-input" id="roomNameInput" placeholder="שם החדר..." />
    <label class="modal-label">אימוג'י לחדר</label>
    <div class="emoji-categories" id="roomEmojiCategories"></div>
    <input class="emoji-search" id="roomEmojiSearch" placeholder="חפש אימוג'י..." oninput="buildRoomEmojiGrid()" />
    <div class="emoji-grid" id="roomEmojiGrid"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRoomModal()">ביטול</button>
      <button class="btn-save" onclick="saveRoom()">שמור</button>
    </div>
  </div>
</div>

<script>
// ===== THEMES =====
const THEMES = [
  { id:'dark',    name:'כהה',      dot:'linear-gradient(135deg,#7c6af7,#f7a26a)', desc:'ברירת מחדל' },
  { id:'light',   name:'בהיר',     dot:'linear-gradient(135deg,#6355e8,#f0812a)', desc:'קלאסי' },
  { id:'pastel',  name:'פסטל',     dot:'linear-gradient(135deg,#d45faa,#f0a040)', desc:'רך ועדין' },
  { id:'mint',    name:'מינט',     dot:'linear-gradient(135deg,#1a9e72,#f07040)', desc:'טבעי' },
  { id:'ocean',   name:'אוקיינוס', dot:'linear-gradient(135deg,#38bdf8,#fb923c)', desc:'עמוק' },
  { id:'sunset',  name:'שקיעה',    dot:'linear-gradient(135deg,#f97316,#ec4899)', desc:'חם' },
  { id:'sand',    name:'חול',      dot:'linear-gradient(135deg,#b07030,#508060)', desc:'ארצי' },
];

function buildThemeGrid() {
  const cur = document.body.getAttribute('data-theme');
  document.getElementById('themeGrid').innerHTML = THEMES.map(t => `
    <div class="theme-option ${t.id===cur?'active':''}" onclick="setTheme('${t.id}')">
      <div class="theme-dot" style="background:${t.dot}"></div>
      <span>${t.name}</span>
    </div>
  `).join('');
}

function setTheme(id) {
  document.body.setAttribute('data-theme', id);
  localStorage.setItem('homeTasksTheme', id);
  buildThemeGrid();
}

function toggleThemePanel() {
  const p = document.getElementById('themePanel');
  p.classList.toggle('hidden');
  if (!p.classList.contains('hidden')) buildThemeGrid();
}

// close panel on outside click
document.addEventListener('click', e => {
  const panel = document.getElementById('themePanel');
  if (!panel.classList.contains('hidden') &&
      !panel.contains(e.target) &&
      !e.target.closest('.theme-btn')) {
    panel.classList.add('hidden');
  }
});

// ===== EMOJI DATA =====
const EMOJI_CATEGORIES = {
  'ניקיון 🧹': ['🧹','🧺','🧻','🧽','🪣','💧','🫧','🧴','🧼','🪥','🪠','♻️','🗑️'],
  'מטבח 🍳':  ['🍳','🥗','🍽️','🥄','🍴','☕','🧃','🫙','🥡','🍜','🥘','🫕','🧆'],
  'כלים 🔧':  ['🔧','🔨','🪛','🔩','⚙️','🧲','💡','🔌','🪜','🗝️','🔑','📦','🧰'],
  'טבע 🌿':   ['🌿','🌸','🌺','🌻','🍀','🌴','🌵','💐','🪴','☀️','🌙','🌈','🌊'],
  'כללי ⭐':  ['✅','❌','⚠️','🔥','⭐','🌟','💪','👍','❤️','🎯','🏆','✨','💎','🎁'],
};
const ALL_EMOJIS = [...new Set(Object.values(EMOJI_CATEGORIES).flat())];
const ROOM_EMOJIS_EXTRA = ['🏠','🛁','🚽','🛏️','💻','🛋️','🌿','🍳','🚿','🪑','🚪','💡','🧹','🏡','🎨','📚','🎵','🏋️','🎮','🛒'];

// ===== STATE =====
const defaultRooms = [
  { id:'kitchen',  name:'מטבח',       emoji:'🍳', tasks:[], collapsed:false },
  { id:'bathroom', name:'חדר אמבטיה', emoji:'🛁', tasks:[], collapsed:false },
  { id:'toilet',   name:'שירותים',    emoji:'🚽', tasks:[], collapsed:false },
  { id:'bedroom',  name:'חדר שינה',   emoji:'🛏️', tasks:[], collapsed:false },
  { id:'office',   name:'חדר עבודה',  emoji:'💻', tasks:[], collapsed:false },
  { id:'living',   name:'סלון',       emoji:'🛋️', tasks:[], collapsed:false },
  { id:'balcony',  name:'מרפסת',      emoji:'🌿', tasks:[], collapsed:false },
];

function loadData() {
  try { const s=localStorage.getItem('homeTasks_v4'); if(s) return JSON.parse(s); } catch(e) {}
  return { rooms: defaultRooms };
}
function saveData() { localStorage.setItem('homeTasks_v4', JSON.stringify(appState)); }

let appState = loadData();

// modal state
let mTaskRoomId=null, mTaskId=null, mEmojiCat=null, mEmoji='✅';
let mRoomId=null, mRoomEmojiCat=null, mRoomEmoji='';

// ===== RENDER =====
function render() {
  let totalPending=0, totalDone=0, totalNa=0;
  appState.rooms.forEach(r => r.tasks.forEach(t => {
    if(t.status==='done') totalDone++;
    else if(t.status==='na') totalNa++;
    else totalPending++;
  }));

  const statsEl = document.getElementById('headerStats');
  statsEl.innerHTML = (totalPending+totalDone+totalNa)>0 ? `
    <span class="stat-pill pending">⏳ ${totalPending}</span>
    <span class="stat-pill done">✅ ${totalDone}</span>
    <span class="stat-pill na">➖ ${totalNa}</span>
  ` : '';

  document.getElementById('pageContent').innerHTML = appState.rooms.map(room => {
    const total  = room.tasks.length;
    const done   = room.tasks.filter(t=>t.status==='done').length;
    const pending= room.tasks.filter(t=>!t.status||t.status==='pending').length;
    const pct    = total ? Math.round((done/total)*100) : 0;

    const tasksHTML = room.tasks.length===0
      ? `<div class="room-empty">אין מטלות — לחץ "+ הוסף" להתחלה 👆</div>`
      : room.tasks.map(t => {
          const status = t.status||'pending';
          return `
            <div class="task-item" data-status="${status}" id="task-${t.id}">
              <button class="task-emoji-btn" onclick="openEditTaskModal('${room.id}','${t.id}',true)">${t.emoji}</button>
              <span class="task-text" onclick="startInlineEdit('${room.id}','${t.id}')">${t.text}</span>
              <div class="status-selector">
                <button class="status-btn ${status==='pending'?'active-pending':''}" onclick="setStatus('${room.id}','${t.id}','pending')">⏳ ממתין</button>
                <button class="status-btn ${status==='done'?'active-done':''}"    onclick="setStatus('${room.id}','${t.id}','done')">✅ בוצע</button>
                <button class="status-btn ${status==='na'?'active-na':''}"        onclick="setStatus('${room.id}','${t.id}','na')">➖ לא רלוונטי</button>
              </div>
              <div class="task-actions">
                <button class="task-action-btn" onclick="openEditTaskModal('${room.id}','${t.id}',false)">✏️</button>
                <button class="task-action-btn delete" onclick="deleteTask('${room.id}','${t.id}')">🗑️</button>
              </div>
            </div>
          `;
        }).join('');

    return `
      <div class="room-card" id="room-${room.id}">
        <div class="room-card-header">
          <div class="room-card-left">
            <button class="room-emoji-btn" onclick="openRoomModal('${room.id}')">${room.emoji}</button>
            <div>
              <span class="room-title" onclick="openRoomModal('${room.id}')">${room.name}</span>
              <div class="room-meta">
                ${total>0
                  ? `<div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
                     <span>${done}/${total} בוצעו · ${pending} ממתינות</span>`
                  : `<span>אין מטלות</span>`}
              </div>
            </div>
          </div>
          <div class="room-card-right">
            <button class="add-task-btn" onclick="openAddTaskModal('${room.id}')">+ הוסף</button>
            <button class="collapse-btn" onclick="toggleCollapse('${room.id}')">${room.collapsed?'▼':'▲'}</button>
          </div>
        </div>
        <div class="room-body${room.collapsed?' collapsed':''}">${tasksHTML}</div>
      </div>
    `;
  }).join('');
}

// ===== ACTIONS =====
function toggleCollapse(id) {
  const r=appState.rooms.find(r=>r.id===id);
  if(r){r.collapsed=!r.collapsed;saveData();render();}
}
function setStatus(roomId, taskId, status) {
  const t=appState.rooms.find(r=>r.id===roomId)?.tasks.find(t=>t.id===taskId);
  if(t){t.status=status;saveData();render();}
}
function deleteTask(roomId, taskId) {
  const r=appState.rooms.find(r=>r.id===roomId);
  if(r){r.tasks=r.tasks.filter(t=>t.id!==taskId);saveData();render();}
}
function startInlineEdit(roomId, taskId) {
  const r=appState.rooms.find(r=>r.id===roomId);
  const t=r?.tasks.find(t=>t.id===taskId); if(!t) return;
  const el=document.querySelector(`#task-${taskId} .task-text`); if(!el) return;
  const input=document.createElement('input');
  input.className='inline-edit-input'; input.value=t.text; input.dir='rtl';
  el.replaceWith(input); input.focus(); input.select();
  const commit=()=>{const v=input.value.trim();if(v){t.text=v;saveData();}render();};
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}if(e.key==='Escape')render();});
}

// ===== EMOJI HELPERS =====
function buildCatBtns(containerId, activeCat, clickFn) {
  document.getElementById(containerId).innerHTML=Object.keys(EMOJI_CATEGORIES).map(cat=>
    `<button class="emoji-cat-btn${cat===activeCat?' active':''}" onclick="${clickFn}('${encodeURIComponent(cat)}')">${cat}</button>`
  ).join('');
}
function buildGrid(gridId, searchId, activeCat, selected, clickFn) {
  const search=(document.getElementById(searchId)?.value||'').toLowerCase();
  let pool=(activeCat&&EMOJI_CATEGORIES[activeCat])?EMOJI_CATEGORIES[activeCat]:ALL_EMOJIS;
  if(search) pool=ALL_EMOJIS;
  document.getElementById(gridId).innerHTML=pool.map(e=>
    `<button class="emoji-opt${e===selected?' selected':''}" onclick="${clickFn}('${e}')">${e}</button>`
  ).join('');
}

// ===== TASK MODAL =====
function openAddTaskModal(roomId) {
  mTaskRoomId=roomId;mTaskId=null;mEmoji='✅';mEmojiCat=null;
  document.getElementById('modalTitle').textContent='➕ מטלה חדשה';
  document.getElementById('taskNameInput').value='';
  document.getElementById('emojiSearch').value='';
  buildCatBtns('emojiCategories',null,'setTaskCat');
  buildGrid('emojiGrid','emojiSearch',null,mEmoji,'pickEmoji');
  document.getElementById('taskModal').style.display='flex';
  setTimeout(()=>document.getElementById('taskNameInput').focus(),80);
}
function openEditTaskModal(roomId, taskId, emojiOnly=false) {
  const r=appState.rooms.find(r=>r.id===roomId);
  const t=r?.tasks.find(t=>t.id===taskId);if(!t)return;
  mTaskRoomId=roomId;mTaskId=taskId;mEmoji=t.emoji;mEmojiCat=null;
  document.getElementById('modalTitle').textContent=emojiOnly?"😊 שנה אימוג'י":'✏️ עריכת מטלה';
  document.getElementById('taskNameInput').value=t.text;
  document.getElementById('emojiSearch').value='';
  buildCatBtns('emojiCategories',null,'setTaskCat');
  buildGrid('emojiGrid','emojiSearch',null,mEmoji,'pickEmoji');
  document.getElementById('taskModal').style.display='flex';
  if(!emojiOnly) setTimeout(()=>document.getElementById('taskNameInput').focus(),80);
}
function setTaskCat(cat){const d=decodeURIComponent(cat);mEmojiCat=(mEmojiCat===d)?null:d;buildCatBtns('emojiCategories',mEmojiCat,'setTaskCat');buildGrid('emojiGrid','emojiSearch',mEmojiCat,mEmoji,'pickEmoji');}
function pickEmoji(e){mEmoji=e;buildGrid('emojiGrid','emojiSearch',mEmojiCat,mEmoji,'pickEmoji');}
function filterEmojis(){buildGrid('emojiGrid','emojiSearch',mEmojiCat,mEmoji,'pickEmoji');}
function closeTaskModal(){document.getElementById('taskModal').style.display='none';}
function handleTaskOverlay(e){if(e.target===document.getElementById('taskModal'))closeTaskModal();}
function saveTask(){
  const text=document.getElementById('taskNameInput').value.trim();
  if(!text){document.getElementById('taskNameInput').focus();return;}
  const r=appState.rooms.find(r=>r.id===mTaskRoomId);if(!r)return;
  if(!mTaskId){r.tasks.push({id:Date.now().toString(),text,emoji:mEmoji,status:'pending'});}
  else{const t=r.tasks.find(t=>t.id===mTaskId);if(t){t.text=text;t.emoji=mEmoji;}}
  saveData();closeTaskModal();render();
}

// ===== ROOM MODAL =====
function openRoomModal(roomId){
  const r=appState.rooms.find(r=>r.id===roomId);if(!r)return;
  mRoomId=roomId;mRoomEmoji=r.emoji;mRoomEmojiCat=null;
  document.getElementById('roomNameInput').value=r.name;
  document.getElementById('roomEmojiSearch').value='';
  buildRoomCatBtns();buildRoomEmojiGrid();
  document.getElementById('roomModal').style.display='flex';
  setTimeout(()=>document.getElementById('roomNameInput').focus(),80);
}
function buildRoomCatBtns(){buildCatBtns('roomEmojiCategories',mRoomEmojiCat,'setRoomCat');}
function buildRoomEmojiGrid(){
  let pool=(mRoomEmojiCat&&EMOJI_CATEGORIES[mRoomEmojiCat])?EMOJI_CATEGORIES[mRoomEmojiCat]:[...new Set([...ROOM_EMOJIS_EXTRA,...ALL_EMOJIS])];
  document.getElementById('roomEmojiGrid').innerHTML=pool.map(e=>
    `<button class="emoji-opt${e===mRoomEmoji?' selected':''}" onclick="pickRoomEmoji('${e}')">${e}</button>`
  ).join('');
}
function setRoomCat(cat){const d=decodeURIComponent(cat);mRoomEmojiCat=(mRoomEmojiCat===d)?null:d;buildRoomCatBtns();buildRoomEmojiGrid();}
function pickRoomEmoji(e){mRoomEmoji=e;buildRoomEmojiGrid();}
function closeRoomModal(){document.getElementById('roomModal').style.display='none';}
function handleRoomOverlay(e){if(e.target===document.getElementById('roomModal'))closeRoomModal();}
function saveRoom(){
  const name=document.getElementById('roomNameInput').value.trim();
  if(!name){document.getElementById('roomNameInput').focus();return;}
  const r=appState.rooms.find(r=>r.id===mRoomId);
  if(r){r.name=name;r.emoji=mRoomEmoji;}
  saveData();closeRoomModal();render();
}

// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeTaskModal();closeRoomModal();document.getElementById('themePanel').classList.add('hidden');}
  if(e.key==='Enter'){
    if(document.getElementById('taskModal').style.display!=='none'&&document.activeElement===document.getElementById('taskNameInput'))saveTask();
    if(document.getElementById('roomModal').style.display!=='none'&&document.activeElement===document.getElementById('roomNameInput'))saveRoom();
  }
});

// ===== INIT =====
const savedTheme = localStorage.getItem('homeTasksTheme');
if (savedTheme) document.body.setAttribute('data-theme', savedTheme);
render();
</script>
</body>
</html>
